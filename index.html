<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Grid Layout</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="galeria-paisajes">
    <img class="imagen-playa-niebla" src="https://picsum.photos/seed/playa-niebla/600/900" alt="Una playa con niebla y una gran formación rocosa en primer plano">
    <img class="imagen-mesa-comida" src="https://picsum.photos/seed/mesa-comida/600/400" alt="Una mesa con platos y cuencos de comida">
    <img class="imagen-edificios-blancos" src="https://picsum.photos/seed/edificios-blancos/600/900" alt="Una fila de edificios de apartamentos blancos junto a una calle">
    <img class="imagen-sala-blanca" src="https://picsum.photos/seed/sala-blanca/600/400" alt="Una sala con un sofá blanco y una ventana redonda">
    <img class="imagen-puerta-roja" src="https://picsum.photos/seed/puerta-roja/600/900" alt="Un edificio con una puerta roja y un árbol al frente">
    <img class="imagen-playa-colina" src="https://picsum.photos/seed/playa-colina/600/400" alt="Vista de una playa desde lo alto de una colina">
  </main>
</body>
</html>
